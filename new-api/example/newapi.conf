# New API 反向代理模板（线上 / 走 Cloudflare 时使用）
#
# 本地开发不用这个文件：直连 http://127.0.0.1:3101 即可。
#
# 上线步骤：
#   1. 把本文件复制到 ../../nginx/sites/newapi.conf
#   2. 把 <DOMAIN> 换成真实域名（与 Cloudflare DNS 记录一致）
#   3. 按需解开下面 Cloudflare 真实 IP 的配置
#   4. docker exec laradock-openresty-1 nginx -t && docker exec laradock-openresty-1 nginx -s reload
#   5. 同时把 .env 里 NEW_API_SESSION_COOKIE_SECURE 改成 true、
#      NEW_API_SESSION_COOKIE_TRUSTED_URL 填 https://<DOMAIN>，再重建容器
#
# 注意：现有 default.conf 是 default_server。如果访问时 Host 与 server_name 不匹配，
# 请求会落到 PHP 站点上，表现为 404 或跳错站。

server {
    listen 80;
    server_name <DOMAIN>;

    client_max_body_size 50m;

    # ---- Cloudflare 真实 IP（可选）----
    # 不解开的话，日志和限流里所有请求都会记成 Cloudflare 的节点 IP。
    # Cloudflare 网段会变，配置前先从官方拉最新列表并替换：
    #   curl -s https://www.cloudflare.com/ips-v4
    #   curl -s https://www.cloudflare.com/ips-v6
    #
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # ... 其余网段照上面命令的输出补全 ...
    # real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://new-api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 访客 → Cloudflare 是 HTTPS，CF 会把原始协议放在这个头里。
        # 不要把这里写死成 https：直接访问源站时会被误判。
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 流式输出（SSE）必须关闭缓冲，否则前端会等到整段结束才显示
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
