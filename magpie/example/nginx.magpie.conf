# magpie 网关反代（Cloudflare 橙云）
#
# 放在 OpenResty 的 sites 目录里，reload 生效。
#
# 关键点：
#   1. 只代理 3430 一个端口 —— magpie 的 3430 同时服务 /（控制台）和 /v1（网关）
#   2. proxy_buffering off —— 不关的话 SSE 会被缓冲，表现为卡住不动
#   3. 不要在这里做 gzip 压缩流式响应
#   4. 代理目标写宿主机网关 IP（172.19.0.1），不写容器名 magpie:3430 ——
#      laradock 的 openresty 只加在 frontend 网络，magpie 在 backend 网络，
#      容器名解析不到。若把 openresty 也加进 backend，才能改成 http://magpie:3430
#
# 两种回源方式二选一：
#   A. Flexible：CF 用 http 回源，只用下面第一个 server 块，不要证书
#   B. Full (strict)：CF 用 https 回源，把第二个 server 块也打开，装上 Origin CA 证书

# ---------- A / B 都需要：80 端口回源 ----------
server {
    listen 80;
    server_name gw.example.com;

    client_max_body_size 32m;

    location / {
        proxy_pass http://172.19.0.1:3430;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 橙云下访客→CF 是 https，CF 回源可能是 http，告诉 magpie 原始协议
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 流式输出必须
        proxy_buffering  off;
        proxy_cache      off;
        gzip             off;

        # 长推理不要被掐断
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        send_timeout        3600s;
    }
}

# ---------- B. Full (strict) 才需要：443 回源 ----------
# CF 后台 SSL/TLS → Origin Server → Create Certificate，
